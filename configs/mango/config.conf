# Docs: https://mangowm.github.io/docs/

# Window effects
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animations
# types: zoom, slide, fade, none
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.0
fade_out_begin_opacity=1.0
tag_animation_direction=1
zoom_initial_ratio=0.9
zoom_end_ratio=0.9
animation_duration_move=350
animation_duration_open=320
animation_duration_tag=400
animation_duration_close=240
animation_duration_focus=0
animation_curve_open=0.33,1,0.68,1
animation_curve_move=0.33,1,0.68,1
animation_curve_tag=0.33,1,0.68,1
animation_curve_close=0.33,1,0.68,1
animation_curve_focus=0.25,1,0.5,1
animation_curve_opacity_fade_in=0.33,1,0.68,1
animation_curve_opacity_fade_out=0.33,1,0.68,1

# Scroller layout
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_ignore_proportion_single=1   # must be 0 for the next line to apply
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-stack layout
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# Dwindle layout
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_preserve_split=0
dwindle_split_ratio=0.5
dwindle_horizontal_split=1
dwindle_vertical_split=1

# Monocle / deck
monocle_tab_mode=1
deck_tab_mode=1

# Overview
hotarea_size=10
enable_hotarea=0
hotarea_corner=2
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_theme=Adwaita
drag_tile_to_tile=1
drag_tile_small=1

# Keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad (relogin to apply)
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse (relogin to apply)
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
border_px=4
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# Tag rules
# layouts: tile, scroller, monocle, grid, deck, center_tile, vertical_tile,
#          right_tile, vertical_scroller, vertical_grid, vertical_deck,
#          dwindle, fair, vertical_fair
tag_rule=id:*,layout_name:tile
# tag_rule=id:1,layout_name:scroller

# Key bindings
# key names from `wev`; mods: SUPER, CTRL, ALT, SHIFT, NONE (combine with +)

# menu and terminal
bind=ALT,space,spawn,bemenu-run -p "Run:" -i
bind=ALT,Return,spawn,kitty

# tag switch
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# move client to tag
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# fullscreen
bind=SUPER+SHIFT,f,togglefullscreen

# layout
bind=SUPER+CTRL,n,switch_layout

# mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,togglefloating

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# window state
bind=SUPER,Return,zoom
bind=SUPER,i,minimized
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,Tab,togglejump

# resize
bind=SUPER+CTRL,l,resizewin,50,0
bind=SUPER+CTRL,h,resizewin,-50,0
bind=SUPER+CTRL,j,resizewin,0,50
bind=SUPER+CTRL,k,resizewin,0,-50

# Monitors
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:144,x:0,y:0,scale:1
monitor_rule=name:^Virtual-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1

# Autostart
exec_once=autost
